<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yazılım Detayı | Ubeyt ÇETİL</title>
    <style>
        :root {
            --bg: #0b1120;
            --card-bg: #1e293b;
            --panel-bg: #0f172a;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.7; padding: 1.5rem 1rem; }
        .container { max-width: 920px; margin: 0 auto; background: var(--card-bg); border-radius: 14px; padding: 2rem; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Breadcrumb Navigasyon */
        .breadcrumb { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.2rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border); }
        .breadcrumb a { color: var(--accent); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        h1 { font-size: 1.9rem; color: #fff; margin-bottom: 0.6rem; line-height: 1.3; }
        .meta-bar { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; background: var(--panel-bg); padding: 0.6rem 1rem; border-radius: 8px; }
        .meta-bar span strong { color: #e2e8f0; }

        .cover-img { width: 100%; max-height: 450px; object-fit: cover; border-radius: 10px; margin-bottom: 1.8rem; border: 1px solid var(--border); }
        
        .section-title { font-size: 1.25rem; color: var(--accent); margin: 1.8rem 0 0.8rem; border-left: 4px solid var(--accent); padding-left: 0.75rem; }
        .intro-text { font-size: 1.05rem; color: #e2e8f0; margin-bottom: 1.5rem; }

        /* Teknik Künye Tablosu */
        .spec-table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; background: var(--panel-bg); border-radius: 8px; overflow: hidden; }
        .spec-table td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        .spec-table td:first-child { font-weight: 600; color: var(--text-muted); width: 35%; background: rgba(255,255,255,0.02); }

        /* Listeler */
        .feature-list, .install-list { padding-left: 1.5rem; color: #e2e8f0; margin-bottom: 1.5rem; }
        .feature-list li, .install-list li { margin-bottom: 0.5rem; }

        /* Video Alanı */
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 10px; margin-bottom: 1.8rem; border: 1px solid var(--border); }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* İndirme Kutusu */
        .download-box { background: var(--panel-bg); padding: 1.8rem; border-radius: 12px; text-align: center; border: 1px dashed var(--accent); margin: 2rem 0; }
        .download-buttons { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin: 1rem 0; }
        .btn-dl { display: inline-block; padding: 0.9rem 1.8rem; border-radius: 8px; font-weight: bold; text-decoration: none; color: #fff; font-size: 1.05rem; transition: 0.2s; }
        .btn-primary { background: var(--success); }
        .btn-primary:hover { background: #059669; transform: translateY(-2px); }
        .btn-secondary { background: var(--warning); color: #0f172a; }
        .btn-secondary:hover { background: #d97706; transform: translateY(-2px); }
        .security-note { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.8rem; }

        /* Geliştirici İmzası */
        .author-box { display: flex; align-items: center; gap: 1rem; background: var(--panel-bg); padding: 1.2rem; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 2rem; }
        .author-avatar { width: 55px; height: 55px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.3rem; color: #fff; flex-shrink: 0; }

        /* Canlı Chat / Yorum Bölümü */
        .chat-section { background: var(--panel-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-top: 2rem; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .chat-status { font-size: 0.8rem; color: var(--success); display: flex; align-items: center; gap: 0.4rem; }
        .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

<div class="container" id="icerikAlani">
    <p>Uygulama verileri yükleniyor...</p>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const programId = urlParams.get('id');

    fetch('uygulamalar.json')
        .then(res => res.json())
        .then(data => {
            const app = data.find(item => item.id === programId);
            const alan = document.getElementById('icerikAlani');

            if (!app) {
                alan.innerHTML = `<div class="breadcrumb"><a href="index.html">Ana Sayfa</a></div><h2>Aradığınız yazılım bulunamadı.</h2>`;
                return;
            }

            document.title = app.baslik + " | Ubeyt ÇETİL";

            const ozelliklerHTML = app.ozellikler ? app.ozellikler.map(o => `<li>${o}</li>`).join('') : '';
            const kurulumHTML = app.kurulum ? app.kurulum.map(k => `<li>${k}</li>`).join('') : '';
            
            const videoHTML = app.youtube_id ? `
                <h2 class="section-title">Video Anlatım ve Kullanım Rehberi</h2>
                <div class="video-wrapper">
                    <iframe src="https://youtube.com{app.youtube_id}" frameborder="0" allowfullscreen></iframe>
                </div>
            ` : '';

            const link2HTML = app.link2 ? `<a href="${app.link2}" class="btn-dl btn-secondary" target="_blank">Alternatif İndirme (Link 2)</a>` : '';

            alan.innerHTML = `
                <div class="breadcrumb">
                    <a href="index.html">Ana Sayfa</a> / <span>${app.kategori || app.platform}</span> / <strong>${app.baslik}</strong>
                </div>

                <h1>${app.baslik}</h1>
                
                <div class="meta-bar">
                    <span>Geliştirici: <strong>Ubeyt ÇETİL</strong></span>
                    <span>Platform: <strong>${app.platform}</strong></span>
                    <span>Boyut: <strong>${app.boyut}</strong></span>
                    <span>Tarih: <strong>${app.tarih}</strong></span>
                </div>

                <img src="${app.resim}" alt="${app.baslik}" class="cover-img">

                <p class="intro-text"><strong>${app.baslik.split('–')[0].trim()},</strong> ${app.tanitim}</p>

                <h2 class="section-title">Yazılım Teknik Bilgileri</h2>
                <table class="spec-table">
                    <tr><td>Uygulama Adı</td><td>${app.baslik}</td></tr>
                    <tr><td>Sürüm</td><td>${app.surum || 'v1.0'}</td></tr>
                    <tr><td>İşletim Sistemi</td><td>${app.gereksinim || app.platform}</td></tr>
                    <tr><td>Dil Seçeneği</td><td>${app.dil || 'Türkçe'}</td></tr>
                    <tr><td>Lisans Durumu</td><td>${app.lisans || 'Ücretsiz'}</td></tr>
                    <tr><td>Dosya Boyutu</td><td>${app.boyut}</td></tr>
                </table>

                <h2 class="section-title">Öne Çıkan Özellikler</h2>
                <ul class="feature-list">${ozelliklerHTML}</ul>

                <h2 class="section-title">Adım Adım Kurulum Rehberi</h2>
                <ol class="install-list">${kurulumHTML}</ol>

                ${videoHTML}

                <div class="download-box">
                    <h3>Güvenli ve Doğrudan İndirme Bağlantıları</h3>
                    <div class="download-buttons">
                        <a href="${app.link1}" class="btn-dl btn-primary" download>Hızlı İndir - Link 1 (${app.boyut})</a>
                        ${link2HTML}
                    </div>
                    <p class="security-note">Bilgi: Kendi geliştirdiğim yazılımlarda mağaza dışı yükleme yaparken cihazınızın "Bilinmeyen Kaynaklar" veya Windows "Yine de Çalıştır" onayını vermeniz yeterlidir.</p>
                </div>

                <div class="author-box">
                    <div class="author-avatar">UÇ</div>
                    <div>
                        <strong>Geliştirici: Ubeyt ÇETİL</strong>
                        <p style="font-size: 0.88rem; color: var(--text-muted);">Bu yazılım tarafımdan geliştirilmiş olup ücretsiz olarak sunulmaktadır. Görüş, öneri ve hata bildirimlerinizi aşağıdaki sohbet alanından iletebilirsiniz.</p>
                    </div>
                </div>

                <div class="chat-section">
                    <div class="chat-header">
                        <h3>💬 Canlı Soru, Destek ve Yorum Alanı</h3>
                        <span class="chat-status"><span class="dot"></span> Geliştirici Sohbeti Aktif</span>
                    </div>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">Programla ilgili sorularınızı aşağıdan yazabilirsiniz (GitHub hesabınızla anında mesaj gönderebilirsiniz).</p>
                    <div id="giscus-container"></div>
                </div>
            `;

            // Giscus Chat Sistemini Dinamik Yükle
            const script = document.createElement('script');
            script.src = "https://giscus.app";
            script.setAttribute("data-repo", "ubeyt2029-stack/ubeyt2029-stack.github.io");
            script.setAttribute("data-repo-id", ""); // Giscus kurulumundan alınacak
            script.setAttribute("data-category", "General");
            script.setAttribute("data-category-id", ""); // Giscus kurulumundan alınacak
            script.setAttribute("data-mapping", "url");
            script.setAttribute("data-strict", "0");
            script.setAttribute("data-reactions-enabled", "1");
            script.setAttribute("data-emit-metadata", "0");
            script.setAttribute("data-input-position", "top");
            script.setAttribute("data-theme", "dark");
            script.setAttribute("data-lang", "tr");
            script.crossOrigin = "anonymous";
            script.async = true;
            document.getElementById('giscus-container').appendChild(script);
            });
            ---

### Adım 3: Canlı Chat (Giscus) Sistemini 1 Dakikada Aktif Etme
Kodun en altındaki sohbet kutusunun mesajları kaydedebilmesi için GitHub deponda **Discussions** (Tartışmalar) özelliğini açman gerekiyor:
1. GitHub'da **`ubeyt2029-stack.github.io`** deponun üst menüsünden **Settings** (Ayarlar) sekmesine tıkla.
2. Aşağı doğru inip **Features** başlığı altındaki **Discussions** kutucuğunu işaretle.
3. Ardından **[giscus.app](https://giscus.app/tr)** adresine git, depo adı kısmına **`ubeyt2029-stack/ubeyt2029-stack.github.io`** yaz.
4. Sayfanın altında sana vereceği **`data-repo-id`** ve **`data-category-id`** kodlarını kopyalayıp `detay.html` dosyasındaki ilgili boş tırnakların (`""`) içine yapıştır.

Artık her program kartının içinde hem profesyonel bir tanıtım vitrini hem de her uygulamanın kendine ait bağımsız bir sohbet/yorum odası çalışacak.

<FollowUp>
NotDefterim uygulamanın **gerçek özelliklerini veya ekran görüntüsünü** paylaşırsan, `uygulamalar.json` içindeki metinleri birebir senin uygulamana özel olarak düzenleyebilirim.
</FollowUp>
