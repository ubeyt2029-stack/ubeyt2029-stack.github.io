<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubeyt ÇETİL | Yazılım & Uygulama Arşivi</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; }
        header { background: #020617; padding: 2rem 1rem; text-align: center; border-bottom: 1px solid #1e293b; }
        header h1 { font-size: 2rem; color: var(--accent); margin-bottom: 0.5rem; }
        header p { color: var(--text-muted); max-width: 600px; margin: 0 auto; }
        
        .controls { max-width: 1200px; margin: 2rem auto 1rem; padding: 0 1rem; display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; }
        .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .filter-btn { background: var(--card-bg); color: var(--text); border: 1px solid #334155; padding: 0.5rem 1.2rem; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .filter-btn.active, .filter-btn:hover { background: var(--accent); border-color: var(--accent); }
        .search-box { padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #334155; background: var(--card-bg); color: var(--text); width: 260px; }

        .grid { max-width: 1200px; margin: 1.5rem auto 4rem; padding: 0 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #334155; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.4); border-color: var(--accent); }
        .card img { width: 100%; height: 180px; object-fit: cover; background: #020617; }
        .card-body { padding: 1.25rem; flex-grow: 1; display: flex; flex-direction: column; }
        .badge { display: inline-block; background: rgba(59, 130, 246, 0.2); color: #60a5fa; font-size: 0.75rem; font-weight: bold; padding: 0.2rem 0.6rem; border-radius: 6px; margin-bottom: 0.75rem; width: fit-content; }
        .card-title { font-size: 1.2rem; margin-bottom: 0.5rem; color: #fff; text-decoration: none; font-weight: 600; }
        .card-title:hover { color: var(--accent); }
        .card-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem; flex-grow: 1; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; padding-top: 0.75rem; font-size: 0.8rem; color: var(--text-muted); }
        .btn-detail { background: var(--accent); color: white; text-decoration: none; padding: 0.4rem 0.9rem; border-radius: 6px; font-weight: 500; transition: 0.2s; }
        .btn-detail:hover { background: var(--accent-hover); }
    </style>
</head>
<body>

<header>
    <h1>Ubeyt ÇETİL | Yazılım Merkezi</h1>
    <p>Kendi geliştirdiğim Windows (EXE) masaüstü yazılımları ve Android (APK) mobil uygulamaları.</p>
</header>

<div class="controls">
    <div class="filters">
        <button class="filter-btn active" onclick="filtrele('Tümü', this)">Tümü</button>
        <button class="filter-btn" onclick="filtrele('Windows', this)">Windows (EXE)</button>
        <button class="filter-btn" onclick="filtrele('Android', this)">Android (APK)</button>
    </div>
    <input type="text" id="aramaKutusu" class="search-box" placeholder="Program ara..." onkeyup="ara()">
</div>

<main class="grid" id="programListesi"></main>

<script>
    let tumUygulamalar = [];
    let aktifKategori = 'Tümü';

    fetch('uygulamalar.json')
        .then(res => res.json())
        .then(data => {
            tumUygulamalar = data;
            listeyiGoster(tumUygulamalar);
        });

    function listeyiGoster(liste) {
        const alan = document.getElementById('programListesi');
        alan.innerHTML = '';
        liste.forEach(app => {
            alan.innerHTML += `
                <article class="card">
                    <a href="detay.html?id=${app.id}">
                        <img src="${app.resim}" alt="${app.baslik}">
                    </a>
                    <div class="card-body">
                        <span class="badge">${app.platform} • ${app.boyut}</span>
                        <a href="detay.html?id=${app.id}" class="card-title">${app.baslik}</a>
                        <p class="card-desc">${app.ozet}</p>
                        <div class="card-footer">
                            <span>${app.tarih}</span>
                            <a href="detay.html?id=${app.id}" class="btn-detail">İncele & İndir</a>
                        </div>
                    </div>
                </article>
            `;
        });
    }

    function filtrele(kategori, btn) {
        aktifKategori = kategori;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        ara();
    }

    function ara() {
        const kelime = document.getElementById('aramaKutusu').value.toLowerCase();
        const filtrelenmis = tumUygulamalar.filter(app => {
            const kategoriUyumu = aktifKategori === 'Tümü' || app.platform === aktifKategori;
            const kelimeUyumu = app.baslik.toLowerCase().includes(kelime) || app.ozet.toLowerCase().includes(kelime);
            return kategoriUyumu && kelimeUyumu;
        });
        listeyiGoster(filtrelenmis);
    }
</script>

</body>
</html>
